<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- static snapshot: csrf token placeholder -->
        <meta name="csrf-token" content="STATIC-PLACEHOLDER">

        <!-- favicon -->
        <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png">
        <link rel="manifest" href="images/favicon/site.webmanifest">

        <title>Laravel</title>

        <!-- Fonts (self-hosted, was fonts.bunny.net) -->
        <link href="assets/fonts/figtree.css" rel="stylesheet" />

        <!-- Compiled Tailwind CSS (was @vite resources/css/app.css) -->
        <link rel="stylesheet" href="assets/app.css">
        <!-- Bundled Alpine.js + slot animation (was @vite resources/js/app.js) -->
        <script defer src="assets/app.js"></script>

        <!-- FontAwesome (self-hosted, was cdnjs 6.5.1) -->
        <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    </head>
    <body class="font-sans antialiased">
        <div class="min-h-screen bg-gray-100">

            <aside class='menu hidden lg:flex flex-col items-end fixed bottom-4 right-0 p-4 text-right z-50 group/menu text-[1rem]'>
                <a href="index.html#top">&#8249; Back</a>
            </aside>

            <!-- Page Content -->
            <main class="top relativerelative h-screen snap-y snap-mandatory overflow-y-auto scroll-smooth">

                <!-- ===== section: top ===== -->
                <section id="top" class="top-section bg-white flex flex-col">
                    <div class='flex-1 h-screen flex flex-col lg:flex-row overflow-hidden'>

                        <!-- animated logo -->
                        <div class='flex-1 font-bold flex justify-center items-center text-slate-700'>
                            <a href="#about" class="flex cursor-pointer">
                                <div id="slot1" class="slot h-[10rem] text-[5rem] md:text-[9rem] leading-[9rem] w-28 md:w-48 flex items-center justify-center overflow-hidden relative">
                                    <div class="letters absolute inset-0 transition-transform duration-500 text-center">
                                        <div>五</div>
                                        <div>5</div>
                                        <div>ご</div>
                                        <div>ゴ</div>
                                        <div>Go</div>
                                    </div>
                                </div>
                                <div id="slot2" class="slot h-[10rem] text-[5rem] md:text-[9rem] leading-[9rem] w-28 md:w-48 flex items-center justify-center overflow-hidden relative">
                                    <div class="letters absolute inset-0 transition-transform duration-500 text-center">
                                        <div>語</div>
                                        <div>ご</div>
                                        <div>ゴ</div>
                                        <div>Go</div>
                                    </div>
                                </div>
                                <div id="slot3" class="slot h-[10rem] text-[5rem] md:text-[9rem] leading-[9rem] w-28 md:w-52 flex items-center justify-center overflow-hidden relative">
                                    <div class="letters absolute inset-0 transition-transform duration-500 text-center">
                                        <div>Go</div>
                                        <div>ゴ</div>
                                        <div>ご</div>
                                    </div>
                                </div>
                            </a>
                        </div>

                        <!-- side menu : authenticated state -->
                        <div class='flex-1 lg:flex-none lg:w-1/3 lg:max-w-[400px] lg:bg-gray-300' x-data="{ mode: 'default' }">
                            <div class="h-full flex flex-col gap-2 p-4 justify-center sm:max-w-sm lg:max-w-full mx-auto bg-slate-200 lg:bg-transparent" x-cloak>

                                <!-- Greeting — random EN/JA casual hello, changes on load -->
                                <div class='text-2xl text-slate-700 mb-2' x-data="{
                                    greetings: [
                                        '元気？ Ludo', 'Howdy, Ludo!', 'やっほー Ludo',
                                        'What\'s up Ludo?', '調子どう？ Ludo', 'Hey Ludo!',
                                        'おっす！ Ludo', 'Yo Ludo!', 'ども！ Ludo'
                                    ],
                                    msg: ''
                                }" x-init="msg = greetings[Math.floor(Math.random() * greetings.length)]" x-text="msg">
                                </div>

                                <!-- Menu links -->
                                <div class="flex flex-col gap-1" x-show="mode === 'default'">
                                    <a href="#" class='top-menu-link long group relative'>
                                        <span class="relative group-hover:text-orange-500 transition-all">Dashboard</span>
                                    </a>
                                    <div @click="mode = 'line'" class='top-menu-link line group relative cursor-pointer'>
                                        <span class="relative transition-all">Line</span>
                                    </div>
                                    <a href="profile-draft.html" class='top-menu-link group relative'>
                                        <span class="relative group-hover:text-slate-500 transition-all">Profile</span>
                                    </a>
                                    <a href="top.html" class='top-menu-link group relative'>
                                        <span class="relative group-hover:text-red-500 transition-all">Logout</span>
                                    </a>
                                </div>

                                <!-- LINE panel -->
                                <div x-show="mode === 'line'" class="flex flex-col gap-4">
                                    <div @click="mode = 'default'" class="text-sm uppercase tracking-widest text-slate-500 cursor-pointer hover:text-slate-700 transition-all">
                                        <i class="fa-solid fa-arrow-left fa-fw"></i> Back
                                    </div>
                                    <div class="bg-slate-700 text-white p-8 text-center uppercase font-bold text-lg tracking-wide">
                                        line invitation
                                    </div>
                                    <div class="bg-slate-700 text-white p-8 text-center uppercase font-bold text-lg tracking-wide">
                                        line invitation
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                    <div class='flex-none h-4 bg-slate-700'></div>
                </section>

            </main>
        </div>
    </body>
</html>
