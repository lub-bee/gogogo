<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- static snapshot: csrf token placeholder -->
        <meta name="csrf-token" content="STATIC-PLACEHOLDER">

        <!-- favicon -->
        <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png">
        <link rel="manifest" href="images/favicon/site.webmanifest">

        <title>Laravel</title>

        <!-- Fonts (self-hosted, was fonts.bunny.net) -->
        <link href="assets/fonts/figtree.css" rel="stylesheet" />

        <!-- Compiled Tailwind CSS (was @vite resources/css/app.css) -->
        <link rel="stylesheet" href="assets/app.css">
        <!-- Bundled Alpine.js + slot animation (was @vite resources/js/app.js) -->
        <script defer src="assets/app.js"></script>

        <!-- FontAwesome (self-hosted, was cdnjs 6.5.1) -->
        <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    </head>
    <body class="font-sans antialiased">
        <div class="min-h-screen bg-gray-100">

            <aside class='menu hidden lg:flex flex-col items-end fixed bottom-4 right-0 p-4 text-right z-50 group/menu text-[1rem]'></aside>

            <!-- Page Content -->
            <main class="top relativerelative h-screen snap-y snap-mandatory overflow-y-auto scroll-smooth">

                <!-- ===== section: top ===== -->
                <section id="top" class="top-section bg-white flex flex-col">
                    <div class='flex-1 h-screen flex flex-col lg:flex-row overflow-hidden'>

                        <!-- animated logo -->
                        <div class='flex-1 font-bold flex justify-center items-center text-slate-700'>
                            <a href="#about" class="flex cursor-pointer">
                                <div id="slot1" class="slot h-[10rem] text-[5rem] md:text-[9rem] leading-[9rem] w-28 md:w-48 flex items-center justify-center overflow-hidden relative">
                                    <div class="letters absolute inset-0 transition-transform duration-500 text-center">
                                        <div>五</div>
                                        <div>5</div>
                                        <div>ご</div>
                                        <div>ゴ</div>
                                        <div>Go</div>
                                    </div>
                                </div>
                                <div id="slot2" class="slot h-[10rem] text-[5rem] md:text-[9rem] leading-[9rem] w-28 md:w-48 flex items-center justify-center overflow-hidden relative">
                                    <div class="letters absolute inset-0 transition-transform duration-500 text-center">
                                        <div>語</div>
                                        <div>ご</div>
                                        <div>ゴ</div>
                                        <div>Go</div>
                                    </div>
                                </div>
                                <div id="slot3" class="slot h-[10rem] text-[5rem] md:text-[9rem] leading-[9rem] w-28 md:w-52 flex items-center justify-center overflow-hidden relative">
                                    <div class="letters absolute inset-0 transition-transform duration-500 text-center">
                                        <div>Go</div>
                                        <div>ゴ</div>
                                        <div>ご</div>
                                    </div>
                                </div>
                            </a>
                        </div>

                        <!-- side menu : guest state (login form). The authenticated state
                             (greeting + Dashboard/Discord/Line/Profile/Logout menu) is not
                             rendered in this static snapshot. -->
                        <div class='flex-1 lg:flex-none lg:w-1/3 lg:max-w-[400px] lg:bg-gray-300'>
                            <form method="POST" action="#login-placeholder" class="h-full flex flex-col gap-4 p-4 justify-center sm:max-w-sm lg:max-w-full mx-auto bg-slate-200 lg:bg-transparent">
                                <!-- @csrf -->
                                <input type="hidden" name="_token" value="STATIC-PLACEHOLDER">
                                <div class='flex justify-between items-center border-b border-gray-400 mb-4 md:mt-8 uppercase text-slate-700'>
                                    Not a member yet? <a href="#register-placeholder" class='btn btn-success'>Join us!</a>
                                </div>
                                <div class=''>
                                    <input type="email" name="email" placeholder="email" class="form-input" autocomplete="username"/>
                                </div>
                                <div class=''>
                                    <input type="password" name="password" placeholder="password" class="form-input" required autocomplete="current-password"/>
                                </div>
                                <div class='text-right'>
                                    <a href="#password-request-placeholder" class="text-slate-700 hover:underline">You have forgot your password?</a>
                                </div>
                                <div class='text-center'>
                                    <a href="top-in.html" class="btn btn-main">sign in</a>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class='flex-none h-4 bg-slate-700'></div>
                </section>

            </main>
        </div>
    </body>
</html>
